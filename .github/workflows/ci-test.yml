---
name: CI BPF Fix Test

"on":
  push:
    branches: [ci-bpf-fix]

jobs:
  test-bpf-configure:
    name: Test BPF Configure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libelf-dev zlib1g-dev g++-13 llvm

      - name: Build libbpf 1.3.0 from source
        run: |
          git clone https://github.com/libbpf/libbpf.git \
            --depth 1 --branch v1.3.0
          cd libbpf/src
          make
          sudo make install
          sudo ldconfig
          echo "/usr/lib64" | sudo tee /etc/ld.so.conf.d/lib64.conf
          sudo ldconfig

      - name: Build bpftool from source
        run: |
          git clone https://github.com/libbpf/bpftool.git \
            --depth 1 --recurse-submodules
          cd bpftool/src
          make
          sudo make install
          which bpftool
          bpftool version
          ls -l /sys/kernel/btf/vmlinux

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git --depth 1
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure
        run: |
          export CC=gcc-13 CXX=g++-13
          TOOLCHAIN=$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN \
            -DTHREVEAL_ENABLE_TESTING=ON \
            -DTHREVEAL_ENABLE_BPF=ON \
            -DTHREVEAL_ENABLE_SANITIZERS=OFF
